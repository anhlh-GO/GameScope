# GamePulse → GitHub Pages
# Cần 1 secret: Settings → Secrets and variables → Actions → New repository secret
#   Name:  GP_PASSWORD_SHA256
#   Value: mã SHA-256 của mật khẩu (tạo trong app: Settings → Security → Change password)
# Data GA4 (chạy tự động mỗi 3 giờ) — 1 trong 2 secret:
#   GA4_SERVICE_ACCOUNT_JSON: toàn bộ nội dung file JSON key của service account (ưu tiên).
#     Lấy mọi GA4 property đã share quyền Viewer cho email service account.
#   WINDSOR_API_KEY: API key Windsor.ai (dùng khi chưa có GA4_SERVICE_ACCOUNT_JSON)
name: Deploy GamePulse
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *" # mỗi 3 giờ (giờ UTC)
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Inject password hash
        env:
          HASH: ${{ secrets.GP_PASSWORD_SHA256 }}
        run: |
          if [ -z "$HASH" ]; then echo "::error::Secret GP_PASSWORD_SHA256 chưa được tạo"; exit 1; fi
          HASH=$(printf '%s' "$HASH" | tr -d '[:space:]' | tr 'A-F' 'a-f')
          if ! printf '%s' "$HASH" | grep -Eq '^[0-9a-f]{64}$'; then echo "::error::GP_PASSWORD_SHA256 phải là chuỗi hex 64 ký tự"; exit 1; fi
          sed -i -E "s/passwordSha256: \"[^\"]*\"/passwordSha256: \"$HASH\"/" config.js
          grep -q "$HASH" config.js || { echo "::error::Không chèn được hash vào config.js"; exit 1; }
      - name: Inject game-manager sync settings (optional)
        env:
          GM_SYNC_URL: ${{ secrets.GM_SYNC_URL }}
          GM_SYNC_TOKEN: ${{ secrets.GM_SYNC_TOKEN }}
        run: |
          if [ -z "$GM_SYNC_URL" ]; then echo "GM_SYNC_URL chưa có — trang Quản lý game chỉ lưu trên từng máy"; exit 0; fi
          node -e '
            const fs = require("fs"); let s = fs.readFileSync("config.js", "utf8");
            const set = (k, v) => { s = s.replace(new RegExp(k + ": \"[^\"]*\""), k + ": " + JSON.stringify(v)); };
            set("gmSyncUrl", process.env.GM_SYNC_URL.trim()); set("gmSyncToken", (process.env.GM_SYNC_TOKEN || "").trim());
            fs.writeFileSync("config.js", s);'
          grep -q 'gmSyncUrl: "https' config.js || { echo "::error::Không chèn được GM_SYNC_URL vào config.js"; exit 1; }
      - name: Fetch GA4 data
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        run: |
          if [ -z "$GA4_SERVICE_ACCOUNT_JSON" ] && [ -z "$WINDSOR_API_KEY" ]; then echo "::error::Chưa có secret GA4_SERVICE_ACCOUNT_JSON (hoặc WINDSOR_API_KEY)"; exit 1; fi
          node scripts/fetch-windsor.mjs
      # Danh sách game cho trang "Quản lý game": sheet "Tạo ID Game_Publisher_new" (cấu hình cột: data/games-map.json).
      # Cần share sheet (Viewer) cho email service account và bật Google Sheets API cho project của nó.
      # Lỗi ở bước này không chặn deploy — trang sẽ báo "Chưa kéo được sheet".
      - name: Fetch game list (Google Sheet)
        continue-on-error: true
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: node scripts/fetch-games.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
